name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check whether this version needs publishing
        id: version
        shell: python
        run: |
          import json
          import os
          import tomllib
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import urlopen

          with open("pyproject.toml", "rb") as source:
              project = tomllib.load(source)["project"]
          name = quote(project["name"], safe="")
          version = quote(project["version"], safe="")
          try:
              with urlopen(f"https://pypi.org/pypi/{name}/{version}/json", timeout=30) as response:
                  release = json.load(response)
              if not release["urls"]:
                  raise RuntimeError("Version exists on PyPI without files; inspect it before publishing")
              publish = False
          except HTTPError as error:
              if error.code != 404:
                  raise
              publish = True
          print(f"{project['name']} {project['version']}: publish={publish}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish={str(publish).lower()}\n")
      - name: Install build tools
        if: steps.version.outputs.publish == 'true'
        run: python -m pip install build twine
      - name: Build source distribution and wheel
        if: steps.version.outputs.publish == 'true'
        run: python -m build
      - name: Validate distributions
        if: steps.version.outputs.publish == 'true'
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish source distribution and wheel to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
